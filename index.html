    patterns: ["hire", "why should", "why hire", "why you"],

  },
  {
    tag: "opportunity",
    patterns: ["job offer", "opportunity", "role for you", "open position", "interested in hiring", "recruit", "position available", "vacancy", "would love to hire", "want to hire", "hiring you", "offer you a"],
    reply: () => {
      notifyOm("Someone may be offering a role / opportunity.");
      return `That's great to hear! 🎉 The best way forward is through my <a href="#contact">contact form</a> just below — fill in your details and I'll personally get back to you.`;
    }
  },
  {
    tag: "resume",
    patterns: ["resume", "cv", "download"],
    reply: () => `You can download my full resume here → <a href="${PROFILE.resumeLink}" target="_blank">${PROFILE.resumeLink}</a>`
  },
  {
    tag: "availability",
    patterns: ["available", "hiring", "open to work", "freelance", "looking for"],
    reply: () => PROFILE.availability
  },
  {
    tag: "location",
    patterns: ["located", "based", "live", "location", "where are you"],
    reply: () => `I'm based in ${PROFILE.location}.`
  },
  {
    tag: "funfact",
    patterns: ["fun fact", "hobby", "hobbies", "free time", "interesting"],
    reply: () => PROFILE.funFact
  },
  {
    tag: "thanks",
    patterns: ["thank", "thanks", "appreciate", "cool", "nice", "great"],
    reply: () => `You're welcome! Anything else you'd like to know — skills, projects, or how to reach me?`
  }
];

function escapeRegex(s){ return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }

function matchIntent(userText){
  const text = userText.toLowerCase();
  let best = null, bestScore = 0;
  for(const intent of INTENTS){
    for(const p of intent.patterns){
      const re = new RegExp('\\b' + escapeRegex(p) + 's?\\b');
      if(re.test(text)){
        const score = p.length;
        if(score > bestScore){ bestScore = score; best = intent; }
      }
    }
  }
  return best;
}

function fallbackReply(){
  return `Hmm, not sure I caught that. Try asking about my <b style="color:var(--brass-soft)">skills</b>, <b style="color:var(--brass-soft)">projects</b>, or <b style="color:var(--brass-soft)">education</b> — or just email me directly at <a href="mailto:${PROFILE.email}">${PROFILE.email}</a>.`;
}

    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
    body: JSON.stringify({

      subject: '🎯 Chatbot lead — someone may want to hire you!',

      message: `${context}\n\nPage: ${window.location.href}\nTime: ${new Date().toLocaleString()}`,

    })
  }).catch(()=>{});
}

/* =========================================================================
   UI WIRING
   ========================================================================= */
let panelOpened = false;

document.getElementById('ai-datalens-cta').href = PROFILE.dataLens.link;

function toggleAIPanel(){
  const panel = document.getElementById('ai-panel');
  panel.classList.toggle('open');
  if(panel.classList.contains('open') && !panelOpened){
    panelOpened = true;
    trackEvent('opens');
    renderChips();
    pushBotMessage(PROFILE.intro);
  }
}

function timeNow(){
  const d = new Date();
  return d.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
}

function pushMessage(html, sender){
  const container = document.getElementById('ai-messages');
  const row = document.createElement('div');
  row.className = `msg-row ${sender}`;
  row.innerHTML = `<div class="msg ${sender}">${html}</div><div class="msg-time">${timeNow()}</div>`;
  container.appendChild(row);
  container.scrollTop = container.scrollHeight;
}

function pushBotMessage(html){
  const container = document.getElementById('ai-messages');
  const typing = document.createElement('div');
  typing.className = 'typing';
  typing.innerHTML = '<span></span><span></span><span></span>';
  container.appendChild(typing);
  container.scrollTop = container.scrollHeight;

  const delay = 450 + Math.random()*400;
  setTimeout(() => {
    typing.remove();
    pushMessage(html, 'bot');
  }, delay);
}

function renderChips(){
  const chipBar = document.getElementById('ai-chips');
  chipBar.innerHTML = '';
  SUGGESTED.forEach(q => {
    const chip = document.createElement('div');
    chip.className = 'chip';
    chip.textContent = q;
    chip.onclick = () => { document.getElementById('ai-input').value = q; sendAIMessage(); };
    chipBar.appendChild(chip);
  });
}

function sendAIMessage(){
  const input = document.getElementById('ai-input');
  const text = input.value.trim();
  if(!text) return;
  pushMessage(text.replace(/</g,"&lt;"), 'user');
  input.value = '';

  const intent = matchIntent(text);
  const reply = intent ? intent.reply() : fallbackReply();
  trackEvent(intent ? `asked-${intent.tag}` : 'asked-unmatched');
  pushBotMessage(reply);
}


/* Basic source-view deterrents — cosmetic only, does not truly hide code */
document.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if (e.key === 'F12') e.preventDefault();
  if (e.ctrlKey && k === 'u') e.preventDefault();
  if (e.ctrlKey && e.shiftKey && (k === 'i' || k === 'j' || k === 'c')) e.preventDefault();
});
